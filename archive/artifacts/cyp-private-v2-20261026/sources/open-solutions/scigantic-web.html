    <!-- Disable browser/Google Translate. The app ships its own JA/EN i18n, so
         browser translation is redundant AND breaks it: Google Translate wraps
         text in <font> tags, which makes the live DOM diverge from React's tree
         and crashes any re-render with "NotFoundError: insertBefore ... not a
         child of this node" (e.g. clicking Launch on the KEK Japanese pages).
         Users switch language with the in-app 日本語/English toggle instead. -->
    <meta name="google" content="notranslate" />
    <script>
      const hostname = window.location.hostname;
      const measurementId =
        hostname === 'scigantic.com' || hostname === 'www.scigantic.com'
          ? 'G-05G67VN67H'
          : hostname === 'staging.scigantic.com'
            ? 'G-VEDGXYZ4KS'
            : null;

      if (measurementId) {
        const script = document.createElement('script');
        script.async = true;
        script.src = `https://www.googletagmanager.com/gtag/js?id=${measurementId}`;
        document.head.appendChild(script);

        window.dataLayer = window.dataLayer || [];
        function gtag(){window.dataLayer.push(arguments);}
        window.gtag = window.gtag || gtag;
        gtag('js', new Date());
        gtag('config', measurementId);
      }
    </script>

    <script>
      // Warm the API connection. The API is a SEPARATE origin from this CDN, so
      // the first data fetch (archive metadata + the /sample notebook) otherwise
      // pays a cold DNS+TCP+TLS handshake before the request even starts. Resolve
      // the right host here (mirrors getApiUrl() in src/utils/api.ts) and inject
      // a preconnect during head parse. crossorigin=anonymous so the warmed
      // socket is actually reused by the CORS fetch().
      (function () {
        var h = window.location.hostname;
        var api =
          h === 'scigantic.com' || h === 'www.scigantic.com'
            ? 'https://api.scigantic.com'
            : h === 'staging.scigantic.com'
              ? 'https://staging-api.scigantic.com'
              : null;
        if (api) {
          var pre = document.createElement('link');
          pre.rel = 'preconnect';
          pre.href = api;
          pre.crossOrigin = '';
          document.head.appendChild(pre);
          var dns = document.createElement('link');
          dns.rel = 'dns-prefetch';
          dns.href = api;
          document.head.appendChild(dns);
        }
      })();
    </script>
