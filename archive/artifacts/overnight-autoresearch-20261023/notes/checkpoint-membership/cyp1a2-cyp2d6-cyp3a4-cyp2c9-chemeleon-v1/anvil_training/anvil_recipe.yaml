data:
  anvil_dir: file:///data1/choderaj/openadmet/xu/models-for-hf-release/cyp_herg_ic50/models
  cat_entry: null
  dropna: false
  input_col: OPENADMET_CANONICAL_SMILES
  resource: data/processed_multitask_cyp.parquet
  target_cols:
  - OPENADMET_LOGAC50_CYP3A4
  - OPENADMET_LOGAC50_CYP2D6
  - OPENADMET_LOGAC50_CYP2C9
  - OPENADMET_LOGAC50_CYP1A2
  test_resource: null
  train_resource: null
  type: intake
  val_resource: null
metadata:
  authors: Cynthia Xu
  biotargets:
  - CYP3A4
  - CYP2D6
  - CYP2D9
  - CYP1A2
  build_number: 0
  description: basic regression using a ChemProp multitask task model
  driver: pytorch
  email: cynthia.xu@omsf.io
  name: chemprop_pchembl
  tag: chemprop
  tags:
  - openadmet
  - example
  - chemprop
  version: v1
procedure:
  ensemble: null
  feat:
    params:
      batch_size: 128
      n_jobs: 4
      normalize_targets: true
    type: ChemPropFeaturizer
  model:
    freeze_weights: null
    param_path: null
    params:
      batch_norm: false
      dropout: 0.1
      ffn_hidden_dim: 1024
      ffn_lr: 1e-3
      ffn_num_layers: 3
      ffn_weight_decay: 1e-4
      from_chemeleon: true
      mpnn_lr: 1e-3
      mpnn_weight_decay: 0
      n_tasks: 4
      reduce_lr_factor: 0.5
      reduce_lr_patience: 5
      scheduler: plateau
    serial_path: null
    type: ChemPropModel
  split:
    params:
      random_state: 42
      test_size: 0
      train_size: 1.0
      val_size: 0
    type: ShuffleSplitter
  train:
    params:
      accelerator: gpu
      early_stopping: true
      early_stopping_min_delta: 0.001
      early_stopping_mode: min
      early_stopping_patience: 20
      gradient_clip_val: 0.5
      max_epochs: 100
      monitor_metric: val_loss
      use_wandb: false
      wandb_project: demos
    type: LightningTrainer
  transform: null
report:
  eval: []
