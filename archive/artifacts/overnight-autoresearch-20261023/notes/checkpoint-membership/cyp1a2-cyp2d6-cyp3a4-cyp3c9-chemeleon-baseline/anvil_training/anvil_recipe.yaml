data:
  anvil_dir: file:///data1/choderaj/openadmet/skunkworks/202510_model_release/mt/chemeleon/chemprop
  cat_entry: null
  dropna: false
  input_col: OPENADMET_CANONICAL_SMILES
  resource: multitask.parquet
  target_cols:
  - OPENADMET_LOGAC50_cyp3a4
  - OPENADMET_LOGAC50_cyp2d6
  - OPENADMET_LOGAC50_cyp2c9
  - OPENADMET_LOGAC50_cyp1a2
  test_resource: null
  train_resource: null
  type: intake
  val_resource: null
metadata:
  authors: Devany West
  biotargets:
  - CYP3A4
  - CYP2D6
  - CYP2C9
  - CYP1A2
  build_number: 0
  description: predicting CYP3A4 AC50 with chemeleon model
  driver: pytorch
  email: devany.west@omsf.io
  name: chemeleon
  tag: openadmet-AC50
  tags:
  - openadmet
  - release
  - AC50
  version: v1
procedure:
  ensemble: null
  feat:
    params:
      batch_size: 128
      n_jobs: 4
      normalize_targets: true
    type: ChemPropFeaturizer
  model:
    freeze_weights: null
    param_path: null
    params:
      batch_norm: true
      depth: 4
      dropout: 0.2
      ffn_hidden_dim: 1024
      ffn_hidden_num_layers: 4
      from_chemeleon: true
      n_tasks: 4
    serial_path: null
    type: ChemPropModel
  split:
    params:
      random_state: 42
      test_size: 0
      train_size: 1.0
      val_size: 0
    type: ShuffleSplitter
  train:
    params:
      accelerator: gpu
      early_stopping: true
      early_stopping_min_delta: 0.001
      early_stopping_mode: min
      early_stopping_patience: 10
      max_epochs: 50
      monitor_metric: val_loss
    type: LightningTrainer
  transform: null
report:
  eval:
  - params: {}
    type: RegressionMetrics
  - params:
      axes_labels:
      - True LogAC50
      - Predicted LogAC50
      max_val: 10
      min_val: 3
      pXC50: true
      title: Multitask True vs Predicted LogAC50 on test set
    type: RegressionPlots
